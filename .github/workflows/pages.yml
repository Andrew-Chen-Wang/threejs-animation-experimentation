name: Deploy animation experiments
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            codex-6-astra-low/package-lock.json
      - run: npm ci
      - run: npm ci --prefix codex-6-astra-low
      - run: npm run test:film --prefix codex-6-astra-low
      - run: npm run check:film --prefix codex-6-astra-low
      - run: npm run build
      - run: npm run build:thailand
      - run: npm run build:film --prefix codex-6-astra-low
      - run: node scripts/build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
