<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fewer Babies Than Japan</title>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="frame"><div id="captions"></div></div>
  </div>
  <div id="controls">
    <button id="play" aria-label="Play or pause">Play</button>
    <input id="scrub" type="range" min="0" max="123.6" step="0.01" value="0" aria-label="Seek" />
    <span id="clock">0:00.0</span>
    <button id="mute" aria-label="Toggle sound">Sound on</button>
  </div>
  <div id="gate">
    <div class="gate-card">
      <div class="gate-kicker">A THREE.JS CUT-PAPER SHORT</div>
      <div class="gate-title">Thailand Has<br/>Fewer Babies<br/>Than Japan</div>
      <button id="gate-play">&#9654;&nbsp; Play</button>
      <div class="gate-note">With the narration of the original short. Space plays and pauses, M mutes, arrow keys seek.</div>
    </div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
