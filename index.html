<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Sound That Finds You</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=block" rel="stylesheet" />
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="frame">
      <div id="hud"></div>
      <div id="captions"></div>
    </div>
  </div>
  <div id="controls">
    <button id="play" aria-label="Play/Pause">Play</button>
    <input id="scrub" type="range" min="0" max="178.8" step="0.01" value="0" />
    <span id="clock">0:00.0</span>
    <label for="audio-file" class="ctl-load" title="Load narration audio">♪</label>
  </div>
  <div id="gate">
    <div class="gate-card">
      <div class="gate-kicker">A THREE.JS EXPLAINER</div>
      <div class="gate-title">The Sound<br/>That Finds You</div>
      <button id="gate-play">&#9654;&nbsp; Play</button>
      <label class="gate-load" for="audio-file">Load narration audio…</label>
      <input id="audio-file" type="file" accept="audio/*,video/*" hidden />
      <div id="gate-note" class="gate-note"></div>
    </div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
