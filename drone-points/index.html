<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Points Per Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=block" rel="stylesheet" />
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="frame"><div id="captions"></div></div>
    <div class="grain"></div>
  </div>
  <div id="controls">
    <button id="play" aria-label="Play or pause">Play</button>
    <input id="scrub" type="range" min="0" max="118.1" step="0.01" value="0" aria-label="Seek" />
    <span id="clock">0:00.0</span>
  </div>
  <div id="gate">
    <div class="gate-card">
      <div class="gate-kicker">A THREE.JS RECREATION</div>
      <div class="gate-title">How many points<br/>is a life?</div>
      <button id="gate-play">&#9654;&nbsp; Play</button>
      <div id="gate-note" class="gate-note">Loading…</div>
      <div class="gate-note">After a reel by Belltake: <a href="https://www.instagram.com/p/De1ywGthBlQ/">instagram.com/p/De1ywGthBlQ</a></div>
    </div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
