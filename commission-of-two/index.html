<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Commission of Two</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+SC:wght@700&family=Noto+Serif+SC:wght@500;700&family=Silkscreen:wght@400;700&display=block" rel="stylesheet" />
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="frame">
      <div id="hud"></div>
      <div id="captions"><span id="word"></span></div>
      <div id="credit"></div>
      <div id="crt"></div>
    </div>
  </div>
  <div id="controls">
    <button id="play" aria-label="Play or pause">Play</button>
    <input id="scrub" type="range" min="0" max="142" step="0.01" value="0" aria-label="Seek" />
    <span id="clock">0:00.0</span>
    <label for="audio-file" class="ctl-load" title="Load narration audio">♪</label>
  </div>
  <div id="gate">
    <div class="gate-card">
      <div class="gate-kicker">A THREE.JS RECONSTRUCTION</div>
      <div class="gate-title">Commission<br/>of Two</div>
      <button id="gate-play">&#9654;&nbsp; Play</button>
      <label class="gate-load" for="audio-file">Load narration audio…</label>
      <input id="audio-file" type="file" accept="audio/*,video/*" hidden />
      <div id="gate-note" class="gate-note"></div>
    </div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
